name: Deploy Ionic Angular App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Este passo cria a pasta e os arquivos que o Angular precisa para o build
      # Ele usa o segredo que você vai configurar no GitHub
      - name: Create environment files
        run: |
          mkdir -p src/environments
          cat << 'EOF' > src/environments/environment.ts
          ${{ secrets.FIREBASE_PROD_FILE }}
          EOF
          cat << 'EOF' > src/environments/environment.prod.ts
          ${{ secrets.FIREBASE_PROD_FILE }}
          EOF

      - name: Build Ionic Angular app
        run: npm run build -- --configuration production --base-href="/OneDevsIonic/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Se o build do Ionic gerar na pasta dist/app, mude aqui. 
          # Geralmente para Ionic é ./www ou ./dist/app-name
          path: ./www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5